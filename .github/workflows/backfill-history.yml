name: Backfill history

# À lancer UNE fois à la main (Actions > Backfill history > Run workflow), puis de temps en temps si besoin.
# Reconstitue l'historique de prix (12 mois) à partir des archives publiques tcgcsv.com / TCGplayer,
# calé sur le prix actuel du flux. Les points ajoutés portent "est": true (affichés en pointillés dans l'app).
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Profondeur de l'historique (mois)"
        default: "12"

permissions:
  contents: write

concurrency:
  group: update-prices          # même groupe que la mise à jour quotidienne : jamais deux écritures en même temps
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill prices.json
        run: python backfill_history.py --months "${{ github.event.inputs.months }}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit if changed
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          cp prices.json /tmp/prices.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/prices.json prices.json
            git add prices.json
            if git diff --cached --quiet; then echo "rien à publier"; exit 0; fi
            git commit -m "Backfill history"
            if git push origin HEAD:main; then exit 0; fi
            echo "push refusé, nouvel essai ($i)"; sleep 3
          done
          exit 1
